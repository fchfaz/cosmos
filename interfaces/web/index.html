<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b1220">
<link rel="manifest" href="/manifest.webmanifest">
<title>Jarvis</title>
<style>
  :root { --bg:#0b1220; --panel:#111a2e; --line:#1f2c47; --text:#e6edf7; --mute:#8aa0c2; --accent:#4cc3ff; --ok:#3ddc97; --bad:#ff6b6b; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:16px/1.45 system-ui,-apple-system,sans-serif;
         height:100dvh; display:flex; flex-direction:column; padding-bottom:env(safe-area-inset-bottom); }
  header { padding:12px 16px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:10px; padding-top:calc(12px + env(safe-area-inset-top)); }
  header b { color:var(--accent); letter-spacing:.12em; }
  header small { color:var(--mute); margin-left:auto; }
  #feed { flex:1; overflow-y:auto; padding:12px 16px; display:flex; flex-direction:column; gap:10px; }
  .msg { max-width:88%; padding:10px 12px; border-radius:12px; white-space:pre-wrap; word-break:break-word; background:var(--panel); border:1px solid var(--line); }
  .me { align-self:flex-end; background:#12304a; border-color:#1b4a73; }
  .sys { border-color:#3a3150; }
  .card { border-color:var(--accent); }
  .card .row { display:flex; gap:8px; margin-top:10px; }
  button { font:inherit; border:0; border-radius:10px; padding:9px 14px; cursor:pointer; color:#04121f; background:var(--accent); }
  button.ok { background:var(--ok); } button.no { background:var(--bad); color:#fff; } button.ghost { background:var(--line); color:var(--text); }
  form { display:flex; gap:8px; padding:10px 16px 14px; border-top:1px solid var(--line); }
  input { flex:1; font:inherit; color:var(--text); background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:11px 12px; min-width:0; }
  #gate { position:fixed; inset:0; background:var(--bg); display:none; align-items:center; justify-content:center; padding:24px; }
  #gate div { width:100%; max-width:380px; display:flex; flex-direction:column; gap:10px; }
</style>
</head>
<body>
<header><b>JARVIS</b><span id="model"></span><small id="state">menghubungkan…</small></header>
<div id="feed"></div>
<form id="f"><input id="t" autocomplete="off" placeholder="Tanya atau perintahkan Jarvis…"><button>Kirim</button></form>
<div id="gate"><div>
  <h3>Masukkan API key Jarvis</h3>
  <input id="k" type="password" placeholder="JARVIS_API_KEY dari .env">
  <button id="kb">Simpan</button>
  <small style="color:var(--mute)">Disimpan hanya di perangkat ini.</small>
</div></div>
<script>
const $ = s => document.querySelector(s);
const feed = $('#feed');
let key = localStorage.getItem('jarvis_key') || '', after = 0;
const shown = new Set();

const hdr = () => ({ 'X-API-Key': key, 'Content-Type': 'application/json' });
async function api(path, opt = {}) {
  const r = await fetch(path, { ...opt, headers: { ...hdr(), ...(opt.headers || {}) } });
  if (r.status === 401 || r.status === 503) { gate(); throw new Error('auth'); }
  return r.json();
}
function gate() { $('#gate').style.display = 'flex'; }
$('#kb').onclick = () => { key = $('#k').value.trim(); localStorage.setItem('jarvis_key', key); $('#gate').style.display = 'none'; poll(); };

function bubble(text, cls = '') {
  const d = document.createElement('div'); d.className = 'msg ' + cls; d.textContent = text;
  feed.appendChild(d); feed.scrollTop = feed.scrollHeight; return d;
}
function approvalCard(id, text) {
  if (shown.has(id)) return; shown.add(id);
  const d = bubble(text, 'card');
  const row = document.createElement('div'); row.className = 'row';
  const done = t => { row.remove(); bubble(t, 'sys'); };
  const ok = Object.assign(document.createElement('button'), { className: 'ok', textContent: '✅ Kirim' });
  const no = Object.assign(document.createElement('button'), { className: 'no', textContent: '❌ Batal' });
  ok.onclick = async () => { const r = await api(`/approvals/${id}/approve`, { method: 'POST', body: '{}' }); done(r.text || r.error); };
  no.onclick = async () => { const r = await api(`/approvals/${id}/reject`, { method: 'POST' }); done(r.text || r.error); };
  row.append(ok, no); d.appendChild(row);
}

$('#f').onsubmit = async e => {
  e.preventDefault();
  const text = $('#t').value.trim(); if (!text) return; $('#t').value = '';
  bubble(text, 'me'); const wait = bubble('…', 'sys');
  try { const r = await api('/chat', { method: 'POST', body: JSON.stringify({ text }) }); wait.textContent = r.text; }
  catch (err) { wait.textContent = 'Gagal menghubungi Jarvis.'; }
};

async function poll() {
  if (!key) return gate();
  try {
    const out = await api('/outbox?after=' + after);
    for (const o of out) {
      after = Math.max(after, o.id);
      if (o.approval_id) approvalCard(o.approval_id, o.text); else bubble(o.text, 'sys');
    }
    const pend = await api('/approvals');
    for (const p of pend) approvalCard(p.id, `✋ [${p.id}] ${p.summary}`);
    $('#state').textContent = 'terhubung';
  } catch (e) { if (e.message !== 'auth') $('#state').textContent = 'terputus'; }
}
fetch('/health').then(r => r.json()).then(h => $('#model').textContent = h.model).catch(() => {});
if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(() => {});
poll(); setInterval(poll, 5000);
</script>
</body>
</html>
